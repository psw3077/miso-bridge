<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MISO ONE 전자약정서</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#12243e;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dde5ef;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #0f2a4a12}.head{padding:24px 20px;background:#0f2a4a;color:#fff}.head small{opacity:.7;font-weight:700;letter-spacing:.12em}.head h1{font-size:25px;margin:7px 0 4px}.head p{margin:0;opacity:.82}.body{padding:20px}.field{margin:0 0 14px}.field b{display:block;font-size:13px;margin-bottom:6px}.box{border:1px solid #ccd7e4;background:#fbfcfe;border-radius:10px;padding:12px;min-height:44px}.doc{white-space:pre-wrap;line-height:1.75;font-size:14px;border:1px solid #d8e0e9;border-radius:12px;padding:16px;background:#fbfcfe}.sig{width:100%;height:170px;border:2px dashed #93a4b8;border-radius:12px;background:#fff;touch-action:none}.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:800;background:#0f2a4a;color:#fff}.btn.alt{background:#e8eef5;color:#17324f}.status{margin-top:12px;padding:12px;border-radius:10px;background:#eef5ff;color:#174a82}.done{background:#edf8f0;color:#24623a}.warn{background:#fff4e8;color:#8a4c16}@media(max-width:600px){.wrap{padding:0}.card{border-radius:0;min-height:100vh}.body{padding:16px}.head{padding:20px 16px}.row{display:grid}.btn{width:100%}}</style></head><body><div class="wrap"><div class="card"><div class="head"><small>MISO ONE · (주)미소주류</small><h1>전자약정서</h1><p>내용을 확인한 뒤 서명해 주세요.</p></div><div class="body" id="app"><div class="status">계약서를 불러오는 중입니다.</div></div></div></div><script>const API='https://lqohxtvcpdwmtonsifga.supabase.co/functions/v1/miso-one-api';const q=new URLSearchParams(location.search),token=q.get('token'),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!token){app.innerHTML='<div class="status warn">유효한 전자약정서 링크가 아닙니다.</div>';return}try{const r=await fetch(API+'?token='+encodeURIComponent(token));const j=await r.json();if(!j.ok)throw Error(j.error||'조회 실패');render(j.contract)}catch(e){app.innerHTML='<div class="status warn">계약서를 불러오지 못했습니다: '+esc(e.message)+'</div>'}}function render(c){document.querySelector('h1').textContent=c.contract_type==='trade'?'거래처 전자약정서':c.contract_type==='employment'?'근로계약서':'근로시간 특례 합의서';const signed=c.status==='signed'||c.status==='completed';app.innerHTML=`<div class="field"><b>이름 / 거래처명</b><div class="box">${esc(c.party_name)}</div></div><div class="field"><b>전화번호</b><div class="box">${esc(c.phone)}</div></div>${c.address?`<div class="field"><b>주소</b><div class="box">${esc(c.address)}</div></div>`:''}${c.business_number?`<div class="field"><b>사업자번호</b><div class="box">${esc(c.business_number)}</div></div>`:''}${c.notes?`<div class="field"><b>메모</b><div class="box">${esc(c.notes)}</div></div>`:''}${c.document_text?`<div class="field"><b>약정 내용</b><div class="doc">${esc(c.document_text)}</div></div>`:''}${signed?`<div class="status done">서명 완료${c.signed_at?' · '+new Date(c.signed_at).toLocaleString('ko-KR'):''}</div>`:`<div class="field"><b>전자서명</b><canvas id="sig" class="sig" width="900" height="300"></canvas></div><div class="row"><button id="clear" class="btn alt">지우기</button><button id="sign" class="btn">동의하고 서명 완료</button></div><div id="msg"></div>`}`;if(!signed)bind()}function bind(){const canvas=document.getElementById('sig'),ctx=canvas.getContext('2d');let down=false;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0f2a4a';const p=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};canvas.onpointerdown=e=>{e.preventDefault();down=true;canvas.setPointerCapture?.(e.pointerId);const a=p(e);ctx.beginPath();ctx.moveTo(a.x,a.y)};canvas.onpointermove=e=>{if(!down)return;e.preventDefault();const a=p(e);ctx.lineTo(a.x,a.y);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=canvas.onpointerleave=()=>down=false;document.getElementById('clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);document.getElementById('sign').onclick=async()=>{const msg=document.getElementById('msg');msg.className='status';msg.textContent='서명 저장 중입니다…';try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,signature:canvas.toDataURL('image/png')})});const j=await r.json();if(!j.ok)throw Error(j.error||'서명 실패');msg.className='status done';msg.textContent='서명이 정상적으로 완료되었습니다.';setTimeout(load,700)}catch(e){msg.className='status warn';msg.textContent='서명 저장 실패: '+e.message}}}load();</script></body></html>
