name: PLB Preview Build

on:
  push:
    branches: [plb-homepage-v1]
    paths:
      - 'plb-homepage/**'
      - '.github/workflows/plb-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plb-homepage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: plb-homepage-dist
          path: plb-homepage/dist
          if-no-files-found: error
