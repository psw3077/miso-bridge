<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b32"><title>미소주류 박상욱 대표 전자명함 QR</title><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:#eef4f8;color:#12263b}.wrap{max-width:520px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 16px 45px #0b2d4d18}.brand{font-weight:950;font-size:28px;color:#071b32}.brand em{font-style:normal;color:#c79a4a}.name{font-size:32px;font-weight:950;margin:18px 0 4px}.role{color:#718096;font-weight:800}.qrbox{margin:24px auto 16px;width:min(78vw,330px);aspect-ratio:1;background:#fff;border:12px solid #f6f8fa;border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden}.qrbox img{width:100%;height:100%;object-fit:contain}.desc{font-size:14px;line-height:1.7;color:#66788c}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #dce6ef;border-radius:14px;padding:14px;font-weight:900;color:#17324c;background:#fff}.primary{background:#071b32;color:#fff;border-color:#071b32}.foot{font-size:11px;color:#8795a5;margin-top:22px;line-height:1.6}</style></head><body><main class="wrap"><section class="card"><div class="brand"><em>MISO</em> 미소주류</div><div class="name">박상욱 대표</div><div class="role">주식회사 미소주류</div><div class="qrbox"><img id="qr" alt="미소주류 박상욱 대표 전자명함 QR"></div><p class="desc">카메라로 QR을 스캔하면 전자명함이 열립니다.<br>전화·카카오톡·신규거래·주류검색·연락처 저장까지 바로 연결됩니다.</p><div class="btns"><a class="btn primary" href="./">전자명함 열기</a><button class="btn" onclick="shareCard()">명함 보내기</button></div><div class="foot">주식회사 미소주류 · 031-336-3077<br>경기 용인시 처인구 모현읍 곡현로718번길 27, B동</div></section></main><script>const target=new URL('./',location.href).href;document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&data='+encodeURIComponent(target);async function shareCard(){const d={title:'박상욱 대표 | 미소주류',text:'주식회사 미소주류 박상욱 대표 전자명함',url:target};if(navigator.share){try{await navigator.share(d)}catch(e){}}else{try{await navigator.clipboard.writeText(target);alert('전자명함 주소를 복사했습니다.')}catch(e){prompt('주소를 복사하세요.',target)}}}</script></body></html>
