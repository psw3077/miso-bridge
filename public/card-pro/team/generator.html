<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISO CARD 직원명함 생성기</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#eef4f8;color:#11283c}.wrap{max-width:760px;margin:auto;padding:24px 14px}.box{background:#fff;border:1px solid #dbe5ed;border-radius:22px;padding:20px;box-shadow:0 10px 30px #17324c12}.brand{font-weight:950;color:#b78942}.title{font-size:28px;font-weight:950;margin:6px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:800;color:#607587}input{width:100%;margin-top:6px;padding:13px;border:1px solid #d8e2ea;border-radius:11px;font:inherit}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,a.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#071b32;color:#fff}.gold{background:#c79a4a;color:#fff}.light{background:#f1f6fa;color:#15324b}.result{margin-top:16px;padding:14px;background:#f7fafc;border:1px solid #dfe8ef;border-radius:13px;word-break:break-all;font-size:12px}.hint{font-size:12px;color:#758594;line-height:1.6;margin-top:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><section class="box"><div class="brand">MISO 미소주류</div><div class="title">직원 전자명함 생성기</div><div class="grid"><label>이름<input id="name" placeholder="예: 홍길동"></label><label>직함<input id="role" placeholder="예: 영업팀 과장"></label><label>휴대폰<input id="phone" placeholder="예: 01012345678"></label><label>담당지역<input id="area" placeholder="예: 송파·강동·하남"></label><label class="full">카드 식별자(선택)<input id="card" placeholder="예: hong-gildong"></label></div><div class="actions"><button class="primary" onclick="makeUrl()">명함 주소 만들기</button><button class="gold" onclick="copyUrl()">주소 복사</button><a id="preview" class="btn light" target="_blank" rel="noreferrer">미리보기</a></div><div id="result" class="result">직원 정보를 입력한 뒤 ‘명함 주소 만들기’를 누르세요.</div><div class="hint">생성된 주소는 직원별 명함 링크로 그대로 사용할 수 있습니다. 신규거래·창업상담 유입 시 직원명이 자동으로 source_staff에 전달되어 관리자 성과분석과 연결됩니다.</div></section></main><script>let current='';function slug(s){return(s||'staff').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9가-힣-]/g,'')||'staff'}function makeUrl(){const n=document.getElementById('name').value.trim(),r=document.getElementById('role').value.trim(),p=document.getElementById('phone').value.trim(),a=document.getElementById('area').value.trim(),c=document.getElementById('card').value.trim()||slug(n);const base=location.href.replace(/generator\.html(?:\?.*)?$/,'index.html');const u=new URL(base);if(n)u.searchParams.set('name',n);if(r)u.searchParams.set('role',r);if(p)u.searchParams.set('phone',p);if(a)u.searchParams.set('area',a);u.searchParams.set('card',c);current=u.toString();document.getElementById('result').textContent=current;document.getElementById('preview').href=current}async function copyUrl(){if(!current)makeUrl();try{await navigator.clipboard.writeText(current);alert('직원 명함 주소를 복사했습니다.')}catch(e){prompt('아래 주소를 복사하세요.',current)}}</script></body></html>
