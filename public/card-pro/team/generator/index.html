<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISO CARD 직원명함 생성기</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#eef4f8;color:#10283e}.wrap{max-width:760px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #dce6ef;border-radius:20px;padding:20px;margin-bottom:14px}h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:800;color:#667b8e}input{width:100%;box-sizing:border-box;margin-top:5px;padding:12px;border:1px solid #d5e0e9;border-radius:10px;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,a.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#071b32;color:#fff}.gold{background:#c79a4a;color:#fff}.light{background:#edf3f7;color:#17354d}.url{word-break:break-all;background:#f6f9fb;padding:12px;border-radius:10px;font-size:12px}.qr{margin-top:12px;display:grid;place-items:center;min-height:180px;border:1px dashed #cad8e3;border-radius:14px}.qr img{max-width:180px;width:100%}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="box"><h1>MISO CARD 직원명함 생성기</h1><p>직원정보를 입력하면 전자명함 주소와 QR을 바로 만듭니다.</p><div class="grid"><label>이름<input id="name" value="미소주류 담당자"></label><label>직함<input id="role" value="영업 담당"></label><label>휴대폰<input id="phone" placeholder="01012345678"></label><label>담당지역<input id="area" value="서울·경기 업소용 종합주류 공급 상담"></label><label>카드 식별자<input id="card" value="sales-01"></label></div><div class="actions"><button class="primary" onclick="make()">명함 주소 만들기</button><button class="light" onclick="copyUrl()">주소 복사</button><a id="preview" class="btn gold" target="_blank">미리보기</a></div></section><section class="box"><b>생성된 주소</b><div id="url" class="url">아직 생성되지 않았습니다.</div><div class="qr" id="qr">주소를 만들면 QR이 표시됩니다.</div></section></main><script>let current='';function make(){const q=new URLSearchParams({name:document.getElementById('name').value.trim(),role:document.getElementById('role').value.trim(),phone:document.getElementById('phone').value.trim(),area:document.getElementById('area').value.trim(),card:document.getElementById('card').value.trim()});current=new URL('../',location.href).href+'?'+q.toString();document.getElementById('url').textContent=current;document.getElementById('preview').href=current;const qr='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(current);document.getElementById('qr').innerHTML='<img alt="직원명함 QR" src="'+qr+'"><div><a class="btn light" href="'+qr+'" target="_blank">QR 크게 보기</a></div>'}async function copyUrl(){if(!current)make();try{await navigator.clipboard.writeText(current);alert('직원명함 주소를 복사했습니다.')}catch(e){prompt('아래 주소를 복사하세요.',current)}}make();</script></body></html>
