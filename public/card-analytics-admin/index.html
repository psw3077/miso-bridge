<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>?꾩옄紐낇븿 ?듦퀎 | MISO CARD</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#14243a;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 18px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{margin:4px 0 20px}button,input,select{font:inherit;padding:10px 12px;border:1px solid #d8e0e7;border-radius:10px;background:#fff}button{cursor:pointer;font-weight:800}.active,.primary{background:#0b2a4b;color:#fff}.login{max-width:410px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;display:grid;gap:12px}.filters{display:flex;gap:7px;flex-wrap:wrap}.kpis,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e0e6eb;border-radius:16px;padding:19px}.card b{display:block;font-size:28px;margin-top:8px}.panel{background:#fff;border-radius:16px;padding:20px;margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f3}th{font-size:11px;color:#728092}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.share{display:grid;grid-template-columns:1fr 1fr 120px auto;gap:8px}.notice{color:#a3362d}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.share{grid-template-columns:1fr}}</style></head><body><main><section id="login" class="login"><small>MISO CARD ANALYTICS</small><h1>愿由ъ옄 濡쒓렇??/h1><input id="email" type="email" placeholder="愿由ъ옄 ?대찓??><input id="password" type="password" placeholder="鍮꾨?踰덊샇"><button class="primary" onclick="login()">濡쒓렇??/button><p id="loginNotice" class="notice"></p></section><section id="app" hidden><header><div><small>MISO CARD</small><h1>4媛??꾩옄紐낇븿 ?듦퀎</h1></div><button onclick="logout()">濡쒓렇?꾩썐</button></header><div class="filters" id="periods"><button data-days="1">?ㅻ뒛</button><button class="active" data-days="7">7??/button><button data-days="30">30??/button><button data-days="0">?꾩껜</button><button onclick="load()">?덈줈怨좎묠</button></div><div class="kpis" id="kpis"></div><section class="panel"><h2>?꾩옄紐낇븿蹂?鍮꾧탳</h2><table><thead><tr><th>?꾩옄紐낇븿</th><th>諛⑸Ц??/th><th>議고쉶??/th><th>?곷떞 ?됰룞</th><th>?꾪솚??/th><th>?좉퇋/?щ갑臾?/th></tr></thead><tbody id="cards"></tbody></table></section><div class="split"><section class="panel"><h2>?좎엯寃쎈줈</h2><div id="sources"></div></section><section class="panel"><h2>踰꾪듉 ?대┃</h2><div id="clicks"></div></section></div><section class="panel"><h2>吏곸썝쨌怨듭쑀留곹겕 ?깃낵</h2><table><thead><tr><th>吏곸썝 肄붾뱶</th><th>怨듭쑀 留곹겕</th><th>諛⑸Ц</th><th>?곷떞 ?됰룞</th></tr></thead><tbody id="staff"></tbody></table></section><section class="panel"><h2>吏곸썝??怨듭쑀留곹겕 留뚮뱾湲?/h2><div class="share"><select id="shareCard"></select><input id="shareStaff" placeholder="吏곸썝 肄붾뱶(?ㅻ챸 ???肄붾뱶 沅뚯옣)"><input id="shareDays" type="number" min="1" max="90" value="30"><button onclick="makeShare()">留곹겕 ?앹꽦</button></div><p id="shareResult"></p></section><p id="notice" class="notice"></p></section></main><script>
const BASE='https://lqohxtvcpdwmtonsifga.supabase.co',KEY='sb_publishable_Wxo0Tl7HSRjKss1RAnhbsg_v5xWN_kR';let token=sessionStorage.getItem('card_admin_token'),days=7,rows=[];const labels={hyundai_park_taewan:'諛뺥깭??쨌 ?꾨??먮룞李?,plb_park_sangmin:'諛뺤긽誘?쨌 PLB',dream_realestate:'?쒕┝遺?숈궛',miso_park_sangwook:'諛뺤긽??쨌 誘몄냼二쇰쪟'};const urls={hyundai_park_taewan:'https://hyundai-park-taewan.vercel.app/',plb_park_sangmin:'https://plbpaint.co.kr/card/',dream_realestate:'https://changwondream.kr/card/',miso_park_sangwook:'https://consult.misoliquor.co.kr/card-pro/'};const conv=['consult_click','quote_click','phone_click','kakao_click'];
async function api(path,options={}){const r=await fetch(BASE+path,{...options,headers:{apikey:KEY,Authorization:`Bearer ${token||KEY}`,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||`HTTP ${r.status}`);return r.status===204?null:r.json()}
async function login(){try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.access_token;sessionStorage.setItem('card_admin_token',token);show();load()}catch(e){loginNotice.textContent='濡쒓렇???먮뒗 愿由ъ옄 沅뚰븳???뺤씤??二쇱꽭??'}}
function logout(){sessionStorage.removeItem('card_admin_token');location.reload()}function show(){login.hidden=true;app.hidden=false;shareCard.innerHTML=Object.entries(labels).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
function eventName(x){return x.event_name||({view:'card_view',phone:'phone_click',sms:'sms_click',kakao:'kakao_click',new_partner:'consult_click',startup:'consult_click',save_contact:'contact_save',share:'share_click',copy_link:'share_click',qr:'qr_entry'}[x.event_type])||x.event_type}function cardId(x){return x.card_id==='park-sangwook'?'miso_park_sangwook':x.card_id}
async function load(){try{let q='/rest/v1/miso_card_events?select=created_at,card_id,event_name,event_type,visitor_id,session_id,entry_source,source_staff,staff_name,share_token_hash,is_first_visit&order=created_at.desc&limit=10000';if(days){const d=new Date();d.setDate(d.getDate()-days);if(days===1)d.setHours(0,0,0,0);q+=`&created_at=gte.${encodeURIComponent(d.toISOString())}`}rows=(await api(q)).map(x=>({...x,event_name:eventName(x),card_id:cardId(x),entry_source:x.entry_source||'direct'}));render();notice.textContent=''}catch(e){notice.textContent='?듦퀎 議고쉶 沅뚰븳???뺤씤??二쇱꽭??'}}
function render(){const views=rows.filter(x=>x.event_name==='card_view'),actions=rows.filter(x=>conv.includes(x.event_name));kpis.innerHTML=[['諛⑸Ц??,new Set(views.map(x=>x.visitor_id||x.session_id||x.created_at)).size],['議고쉶??,views.length],['?몄뀡',new Set(views.map(x=>x.session_id||x.created_at)).size],['?곷떞 ?됰룞',actions.length],['?곷떞 ?꾪솚??,views.length?Math.round(actions.length/views.length*1000)/10+'%':'0%']].map(x=>`<article class="card"><span>${x[0]}</span><b>${x[1]}</b></article>`).join('');cards.innerHTML=Object.entries(labels).map(([id,label])=>{const all=rows.filter(x=>x.card_id===id),v=all.filter(x=>x.event_name==='card_view'),c=all.filter(x=>conv.includes(x.event_name)),n=v.filter(x=>x.is_first_visit).length;return`<tr><td>${label}</td><td>${new Set(v.map(x=>x.visitor_id||x.session_id||x.created_at)).size}</td><td>${v.length}</td><td>${c.length}</td><td>${v.length?Math.round(c.length/v.length*1000)/10:0}%</td><td>${n} / ${Math.max(0,v.length-n)}</td></tr>`}).join('');list(sources,countBy(views,'entry_source'));list(clicks,countBy(rows.filter(x=>x.event_name!=='card_view'),'event_name'));const names=[...new Set(rows.map(x=>x.source_staff||x.staff_name).filter(Boolean))];staff.innerHTML=names.map(name=>{const a=rows.filter(x=>(x.source_staff||x.staff_name)===name);return`<tr><td>${esc(name)}</td><td>${new Set(a.map(x=>x.share_token_hash).filter(Boolean)).size}</td><td>${a.filter(x=>x.event_name==='card_view').length}</td><td>${a.filter(x=>conv.includes(x.event_name)).length}</td></tr>`}).join('')||'<tr><td colspan="4">怨듭쑀留곹겕 ?곗씠?곌? ?꾩쭅 ?놁뒿?덈떎.</td></tr>'}
function countBy(a,k){return Object.entries(a.reduce((m,x)=>(m[x[k]||'other']=(m[x[k]||'other']||0)+1,m),{})).sort((a,b)=>b[1]-a[1])}function list(el,a){el.innerHTML=a.map(x=>`<p>${esc(x[0])} <b style="float:right">${x[1]}</b></p>`).join('')||'<p>?곗씠???놁쓬</p>'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function makeShare(){try{const raw=crypto.randomUUID(),hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)))].map(x=>x.toString(16).padStart(2,'0')).join(''),expire=new Date(Date.now()+Math.min(90,Math.max(1,+shareDays.value||30))*86400000).toISOString();await api('/rest/v1/miso_card_share_links',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({token_hash:hash,card_id:shareCard.value,source_staff:shareStaff.value.trim().slice(0,80),expires_at:expire})});const u=new URL(urls[shareCard.value]);u.searchParams.set('share_token',raw);u.searchParams.set('utm_source','direct');shareResult.innerHTML=`<a href="${u}" target="_blank">${u}</a>`}catch(e){shareResult.textContent='吏곸썝 肄붾뱶? 愿由ъ옄 沅뚰븳???뺤씤??二쇱꽭??'}}
document.querySelectorAll('#periods [data-days]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#periods [data-days]').forEach(x=>x.classList.remove('active'));b.classList.add('active');days=+b.dataset.days;load()});if(token){show();load()}
</script></body></html>
