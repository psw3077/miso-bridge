<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전자명함 통계 | MISO CARD</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#14243a;font-family:system-ui,"Noto Sans KR",sans-serif}main{max-width:1180px;margin:auto;padding:28px 18px 70px}header,.filters,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}button,input,select{font:inherit;padding:10px 12px;border:1px solid #d7e0e8;border-radius:10px;background:#fff}button{cursor:pointer;font-weight:700}.primary,.active{background:#0b2a4b;color:#fff}.danger{color:#a3362d}.login{max-width:410px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;display:grid;gap:12px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #e0e6eb;border-radius:16px;padding:19px}.card b{display:block;font-size:28px;margin-top:8px}.panel{margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f3}th{font-size:12px;color:#718095}.notice{color:#a3362d}.share-form{display:grid;grid-template-columns:1fr 1fr 120px auto;gap:8px}.result{padding:14px;background:#edf7f2;border-radius:12px;word-break:break-all}.muted{color:#718095;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf0f3;font-size:12px}.pill.live{background:#e5f6eb;color:#176a35}.mfa-qr{display:block;width:min(230px,100%);margin:4px auto;border-radius:12px}.secondary{background:#fff;color:#0b2a4b}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.share-form{grid-template-columns:1fr}}
</style></head><body><main>
<section id="loginPanel" class="login"><small>MISO CARD ANALYTICS</small><h1>관리자 로그인</h1><input id="emailInput" type="email" placeholder="관리자 이메일"><input id="passwordInput" type="password" placeholder="비밀번호"><button class="primary" id="loginButton">로그인</button><p id="loginNotice" class="notice"></p></section>
<section id="mfaPanel" class="login" hidden><small>SECURE ADMIN</small><h1>2단계 인증</h1><p class="muted">인증 앱의 6자리 코드를 입력해야 통계를 열 수 있습니다.</p><img id="mfaQr" class="mfa-qr" hidden alt="인증 앱 등록 QR 코드"><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6자리 인증 코드"><button class="primary" id="mfaButton">인증하고 열기</button><button class="secondary" id="mfaCancelButton">다른 계정으로 로그인</button><p id="mfaNotice" class="notice"></p></section>
<section id="dashboard" hidden><header><div><small>MISO CARD</small><h1>4개 전자명함 통계</h1></div><button id="logoutButton">로그아웃</button></header>
<div class="filters"><div id="periodButtons"><button data-days="1">오늘</button><button class="active" data-days="7">7일</button><button data-days="30">30일</button><button data-days="0">전체</button></div><button id="reloadButton">새로고침</button></div>
<div class="kpis" id="kpis"></div>
<section class="panel"><h2>전자명함별 비교</h2><table><thead><tr><th>전자명함</th><th>방문자</th><th>조회</th><th>상담 행동</th><th>전환율</th><th>신규 / 재방문</th></tr></thead><tbody id="cardRows"></tbody></table></section>
<section class="panel"><h2>유입경로</h2><table><thead><tr><th>경로</th><th>조회</th></tr></thead><tbody id="sourceRows"></tbody></table></section>
<section class="panel"><h2>버튼 이벤트</h2><table><thead><tr><th>이벤트</th><th>횟수</th></tr></thead><tbody id="eventRows"></tbody></table></section>
<section class="panel"><h2>직원·공유링크 성과</h2><table><thead><tr><th>직원 코드</th><th>공유링크</th><th>방문</th><th>상담 행동</th></tr></thead><tbody id="staffRows"></tbody></table></section>
<section class="panel"><h2>직원용 공유링크 만들기</h2><p class="muted">원본 토큰은 저장하지 않으며 생성 직후 한 번만 표시됩니다.</p><div class="share-form"><select id="shareCard"></select><input id="shareStaff" maxlength="80" placeholder="직원 코드 또는 이름"><input id="shareDays" type="number" min="1" max="90" value="30"><button class="primary" id="createShareButton">링크 생성</button></div><div id="shareResult" hidden class="result"></div></section>
<section class="panel"><div class="actions"><h2>공유링크 관리</h2><button id="reloadSharesButton">목록 새로고침</button></div><table><thead><tr><th>전자명함</th><th>직원</th><th>생성일</th><th>만료일</th><th>상태</th><th>관리</th></tr></thead><tbody id="shareRows"></tbody></table></section>
<p id="notice" class="notice"></p></section>
</main><script>
const BASE="https://lqohxtvcpdwmtonsifga.supabase.co",KEY="sb_publishable_Wxo0Tl7HSRjKss1RAnhbsg_v5xWN_kR";
const LABELS={hyundai_park_taewan:"박태완 · 현대자동차",plb_park_sangmin:"박상민 · PLB",dream_realestate:"박미숙 · 드림부동산",miso_park_sangwook:"박상욱 · 미소주류"};
const URLS={hyundai_park_taewan:"https://hyundai-park-taewan.vercel.app/",plb_park_sangmin:"https://plbpaint.co.kr/card/",dream_realestate:"https://changwondream.kr/card/",miso_park_sangwook:"https://consult.misoliquor.co.kr/card-pro/"};
const ACTIONS=["consult_click","quote_click","phone_click","kakao_click","sms_click"];
let token=sessionStorage.getItem("card_admin_token"),factorId="",days=7,rows=[],shares=[];
async function api(path,options={}){const response=await fetch(BASE+path,{...options,headers:{apikey:KEY,Authorization:"Bearer "+(token||KEY),"Content-Type":"application/json",...(options.headers||{})}});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.message||"HTTP "+response.status)}return response.status===204?null:response.json()}
function normalizeEvent(row){const legacy={view:"card_view",phone:"phone_click",sms:"sms_click",kakao:"kakao_click",new_partner:"consult_click",startup:"consult_click",save_contact:"contact_save",share:"share_click",copy_link:"share_click",qr:"qr_entry"};return row.event_name||legacy[row.event_type]||row.event_type}
function normalizeCard(id){return id==="park-sangwook"?"miso_park_sangwook":id}
function showDashboard(){loginPanel.hidden=true;mfaPanel.hidden=true;dashboard.hidden=false;shareCard.innerHTML=Object.entries(LABELS).map(([id,label])=>'<option value="'+id+'">'+label+"</option>").join("")}
async function authApi(path,options={}){const response=await fetch(BASE+"/auth/v1"+path,{...options,headers:{apikey:KEY,Authorization:"Bearer "+token,"Content-Type":"application/json",...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||"AUTH "+response.status);return data}
function jwtAal(value){try{return JSON.parse(atob(value.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).aal||"aal1"}catch{return "aal1"}}
async function beginMfa(){const data=await authApi("/user");const factors=Array.isArray(data.factors)?data.factors:[];const verified=factors.find(x=>x.factor_type==="totp"&&x.status==="verified")||factors.find(x=>x.status==="verified");loginNotice.textContent="";if(!verified){showDashboard();await Promise.all([load(),loadShares()]);return}factorId=verified.id;mfaQr.hidden=true;loginPanel.hidden=true;dashboard.hidden=true;mfaPanel.hidden=false;mfaNotice.textContent="인증 앱의 6자리 코드를 입력해 주세요."}
async function login(){try{const data=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:emailInput.value,password:passwordInput.value})});token=data.access_token;sessionStorage.setItem("card_admin_token",token);await beginMfa()}catch(e){loginNotice.textContent="로그인 정보 또는 관리자 권한을 확인해 주세요."}}
async function verifyMfa(){const code=mfaCode.value.replace(/\D/g,"");if(!factorId||!/^[0-9]{6}$/.test(code)){mfaNotice.textContent="6자리 인증 코드를 입력해 주세요.";return}try{mfaButton.disabled=true;const challenge=await authApi("/factors/"+encodeURIComponent(factorId)+"/challenge",{method:"POST",body:"{}"});const data=await authApi("/factors/"+encodeURIComponent(factorId)+"/verify",{method:"POST",body:JSON.stringify({challenge_id:challenge.id,code})});token=data.access_token;sessionStorage.setItem("card_admin_token",token);mfaPanel.hidden=true;showDashboard();await Promise.all([load(),loadShares()])}catch(e){mfaNotice.textContent="인증 코드가 맞지 않거나 만료되었습니다."}finally{mfaButton.disabled=false}}
async function logout(){try{if(token)await authApi("/logout",{method:"POST",body:"{}"})}catch{}sessionStorage.removeItem("card_admin_token");location.reload()}
async function load(){try{let path="/rest/v1/miso_card_events?select=created_at,card_id,event_name,event_type,visitor_id,session_id,entry_source,source_staff,staff_name,share_token_hash,is_first_visit&order=created_at.desc&limit=10000";if(days){const from=new Date();from.setDate(from.getDate()-days);if(days===1)from.setHours(0,0,0,0);path+="&created_at=gte."+encodeURIComponent(from.toISOString())}rows=(await api(path)).map(r=>({...r,event_name:normalizeEvent(r),card_id:normalizeCard(r.card_id),entry_source:r.entry_source||"direct"}));render();notice.textContent=""}catch(e){notice.textContent="통계 조회 권한을 확인해 주세요."}}
function countBy(items,key){return Object.entries(items.reduce((m,x)=>(m[x[key]||"other"]=(m[x[key]||"other"]||0)+1,m),{})).sort((a,b)=>b[1]-a[1])}
function tableRows(items){return items.map(([name,count])=>"<tr><td>"+escapeHtml(name)+"</td><td>"+count+"</td></tr>").join("")||'<tr><td colspan="2">데이터 없음</td></tr>'}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const views=rows.filter(x=>x.event_name==="card_view"),actions=rows.filter(x=>ACTIONS.includes(x.event_name));const visitors=new Set(views.map(x=>x.visitor_id||x.session_id||x.created_at)).size,sessions=new Set(views.map(x=>x.session_id||x.created_at)).size,rate=views.length?Math.round(actions.length/views.length*1000)/10:0;kpis.innerHTML=[["방문자",visitors],["조회",views.length],["세션",sessions],["상담 행동",actions.length],["전환율",rate+"%"]].map(x=>'<article class="card"><span>'+x[0]+'</span><b>'+x[1]+"</b></article>").join("");cardRows.innerHTML=Object.entries(LABELS).map(([id,label])=>{const all=rows.filter(x=>x.card_id===id),v=all.filter(x=>x.event_name==="card_view"),a=all.filter(x=>ACTIONS.includes(x.event_name)),n=v.filter(x=>x.is_first_visit).length;return "<tr><td>"+label+"</td><td>"+new Set(v.map(x=>x.visitor_id||x.session_id||x.created_at)).size+"</td><td>"+v.length+"</td><td>"+a.length+"</td><td>"+(v.length?Math.round(a.length/v.length*1000)/10:0)+"%</td><td>"+n+" / "+Math.max(0,v.length-n)+"</td></tr>"}).join("");sourceRows.innerHTML=tableRows(countBy(views,"entry_source"));eventRows.innerHTML=tableRows(countBy(rows.filter(x=>x.event_name!=="card_view"),"event_name"));const staff=[...new Set(rows.map(x=>x.source_staff||x.staff_name).filter(Boolean))];staffRows.innerHTML=staff.map(name=>{const own=rows.filter(x=>(x.source_staff||x.staff_name)===name);return "<tr><td>"+escapeHtml(name)+"</td><td>"+new Set(own.map(x=>x.share_token_hash).filter(Boolean)).size+"</td><td>"+own.filter(x=>x.event_name==="card_view").length+"</td><td>"+own.filter(x=>ACTIONS.includes(x.event_name)).length+"</td></tr>"}).join("")||'<tr><td colspan="4">공유링크 데이터가 아직 없습니다.</td></tr>'}
async function sha256(value){const bytes=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function createShare(){const staff=shareStaff.value.trim(),expiry=Math.min(90,Math.max(1,Number(shareDays.value)||30));if(!staff){shareResult.hidden=false;shareResult.textContent="직원 코드를 입력해 주세요.";return}try{createShareButton.disabled=true;const raw=crypto.randomUUID()+"-"+crypto.randomUUID(),hash=await sha256(raw),expiresAt=new Date(Date.now()+expiry*86400000).toISOString();await api("/rest/v1/miso_card_share_links",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({token_hash:hash,card_id:shareCard.value,source_staff:staff,expires_at:expiresAt})});const url=new URL(URLS[shareCard.value]);url.searchParams.set("share_token",raw);url.searchParams.set("utm_source","direct");shareResult.hidden=false;shareResult.innerHTML="<b>생성 완료 — 지금 복사해 보관하세요.</b><p id='newShareUrl'>"+escapeHtml(url.toString())+"</p><button id='copyShareButton'>링크 복사</button>";copyShareButton.onclick=async()=>{await navigator.clipboard.writeText(url.toString());copyShareButton.textContent="복사됨"};shareStaff.value="";await loadShares()}catch(e){shareResult.hidden=false;shareResult.textContent="공유링크 생성에 실패했습니다: "+e.message}finally{createShareButton.disabled=false}}
async function loadShares(){try{shares=await api("/rest/v1/miso_card_share_links?select=id,card_id,source_staff,created_at,expires_at,revoked_at&order=created_at.desc&limit=500");renderShares()}catch(e){shareRows.innerHTML='<tr><td colspan="6">공유링크 조회 권한을 확인해 주세요.</td></tr>'}}
function renderShares(){const now=Date.now();shareRows.innerHTML=shares.map(item=>{const live=!item.revoked_at&&new Date(item.expires_at).getTime()>now,status=item.revoked_at?"폐기됨":live?"사용 중":"만료됨";return "<tr><td>"+escapeHtml(LABELS[item.card_id]||item.card_id)+"</td><td>"+escapeHtml(item.source_staff)+"</td><td>"+new Date(item.created_at).toLocaleDateString("ko-KR")+"</td><td>"+new Date(item.expires_at).toLocaleDateString("ko-KR")+"</td><td><span class='pill "+(live?"live":"")+"'>"+status+"</span></td><td>"+(live?'<button class="danger" data-revoke="'+item.id+'">폐기</button>':"-")+"</td></tr>"}).join("")||'<tr><td colspan="6">생성된 공유링크가 없습니다.</td></tr>';shareRows.querySelectorAll("[data-revoke]").forEach(button=>button.onclick=()=>revokeShare(button.dataset.revoke))}
async function revokeShare(id){if(!confirm("이 공유링크를 폐기할까요? 폐기 후에는 직원 성과로 귀속되지 않습니다."))return;try{await api("/rest/v1/miso_card_share_links?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({revoked_at:new Date().toISOString()})});await loadShares()}catch(e){notice.textContent="공유링크 폐기에 실패했습니다: "+e.message}}
loginButton.onclick=login;mfaButton.onclick=verifyMfa;mfaCancelButton.onclick=logout;mfaCode.oninput=()=>{mfaCode.value=mfaCode.value.replace(/\D/g,"")};logoutButton.onclick=logout;reloadButton.onclick=()=>Promise.all([load(),loadShares()]);reloadSharesButton.onclick=loadShares;createShareButton.onclick=createShare;periodButtons.querySelectorAll("[data-days]").forEach(button=>button.onclick=()=>{periodButtons.querySelectorAll("[data-days]").forEach(x=>x.classList.remove("active"));button.classList.add("active");days=Number(button.dataset.days);load()});if(token){if(jwtAal(token)==="aal2"){showDashboard();Promise.all([load(),loadShares()])}else beginMfa().catch(()=>logout())}
</script></body></html>
