<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#002c5f"><title>내 차 추천받기 | 박태완 카마스터</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f8;font-family:Pretendard,'Noto Sans KR',sans-serif;color:#142b43}.w{max-width:680px;margin:auto;padding:18px 13px 70px}.hero{background:linear-gradient(135deg,#002c5f,#006a9c);color:#fff;border-radius:26px;padding:27px 22px}.hero b{font-size:28px}.hero p{line-height:1.7;color:#d7e9f3}.card{background:#fff;border-radius:20px;padding:20px;margin-top:12px;border:1px solid #dce6ed}.card h2{font-size:16px;margin:0 0 12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts label{border:1px solid #d9e4ec;border-radius:13px;padding:12px;font-size:13px;font-weight:800;background:#f8fbfd}.opts input{margin-right:6px}select,input[type=number]{width:100%;padding:13px;border:1px solid #d6e1e9;border-radius:12px;font-size:14px}.go{width:100%;border:0;border-radius:15px;background:#002c5f;color:#fff;padding:17px;font-size:16px;font-weight:900;margin-top:14px}.official{display:block;text-align:center;text-decoration:none;color:#006a9c;font-weight:850;margin-top:13px;font-size:13px}.note{font-size:11px;color:#788b9b;line-height:1.6}</style></head><body><main class="w"><section class="hero"><b>🚘 내 차 추천받기</b><p>몇 가지만 선택해 주세요. 특정 차량을 자동으로 단정하지 않고, 고객님의 조건을 박태완 카마스터에게 정리해 전달해 비교 상담을 받을 수 있게 도와드립니다.</p></section><form id="f"><section class="card"><h2>1. 주로 몇 명이 타시나요?</h2><select id="family"><option>1~2명</option><option>3~4명</option><option>5명 이상</option></select></section><section class="card"><h2>2. 가장 중요한 조건은?</h2><div class="opts"><label><input type="radio" name="priority" value="연비" checked>연비</label><label><input type="radio" name="priority" value="넓은 공간">넓은 공간</label><label><input type="radio" name="priority" value="가격">가격</label><label><input type="radio" name="priority" value="주행성능">주행성능</label><label><input type="radio" name="priority" value="전기차">전기차</label><label><input type="radio" name="priority" value="업무·적재">업무·적재</label></div></section><section class="card"><h2>3. 월/총 예산 범위</h2><select id="budget"><option>아직 미정</option><option>3천만원대</option><option>4천만원대</option><option>5천만원대</option><option>6천만원 이상</option></select></section><section class="card"><h2>4. 주행 환경</h2><div class="opts"><label><input type="radio" name="drive" value="도심·출퇴근" checked>도심·출퇴근</label><label><input type="radio" name="drive" value="장거리·고속도로">장거리</label><label><input type="radio" name="drive" value="가족·여행">가족·여행</label><label><input type="radio" name="drive" value="사업·업무">사업·업무</label></div></section><section class="card"><h2>5. 선호 동력</h2><select id="power"><option>상관없음</option><option>가솔린</option><option>하이브리드</option><option>전기차</option></select></section><button class="go">박태완 카마스터에게 추천 요청</button></form><a class="official" href="https://www.hyundai.com/kr/ko/e/vehicles/comparison">현대자동차 공식 모델 비교 →</a><p class="note">차량 사양·가격·혜택은 변경될 수 있습니다. 추천 결과는 구매 결정을 위한 참고 상담이며 실제 계약 조건은 현대자동차 공식 정보와 카마스터 상담을 통해 확인해 주세요.</p></main><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=n=>document.querySelector('input[name='+n+']:checked').value;const msg='안녕하세요. 전자명함에서 내 차 추천 상담 요청드립니다.\n탑승인원: '+family.value+'\n중요조건: '+v('priority')+'\n예산: '+budget.value+'\n주행환경: '+v('drive')+'\n선호동력: '+power.value+'\n조건에 맞는 현대자동차 2~3개 차종 비교와 견적 상담 부탁드립니다.';location.href='sms:01035656778?body='+encodeURIComponent(msg)}</script></body></html>
