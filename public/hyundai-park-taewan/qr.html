<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#002c5f"><title>박태완 카마스터 QR 전자명함</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;font-family:Pretendard,'Noto Sans KR',system-ui;color:#10243e}.wrap{max-width:560px;margin:auto;padding:28px 16px;text-align:center}.card{background:#fff;border-radius:28px;padding:28px 20px;box-shadow:0 18px 45px #002c5f22}.brand{color:#002c5f;font-weight:950;font-size:14px}.name{font-size:38px;font-weight:950;margin:12px 0 3px}.role{color:#65798c;font-weight:800}.qr{width:260px;height:260px;margin:25px auto 15px;background:#fff;border:12px solid #fff;border-radius:20px;box-shadow:0 8px 25px #0002}.qr img{width:100%;height:100%}.phone{font-size:24px;font-weight:950;color:#002c5f}.sub{font-size:13px;color:#718295;line-height:1.7;margin:12px}.buttons{display:grid;gap:9px;margin-top:18px}.buttons a,.buttons button{border:0;border-radius:14px;padding:15px;text-decoration:none;font:inherit;font-weight:900;cursor:pointer}.primary{background:#002c5f;color:#fff}.secondary{background:#e7f5fb;color:#006b91}.foot{font-size:11px;color:#8392a0;margin-top:18px}</style></head><body><main class="wrap"><section class="card"><div class="brand">HYUNDAI MOTOR · TONGYEONG</div><div class="name">박태완</div><div class="role">현대자동차 통영지점 · 카마스터</div><div class="qr"><img alt="박태완 전자명함 QR" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https%3A%2F%2Fhyundai-park-taewan.vercel.app%2F"></div><div class="phone">010-3565-6778</div><div class="sub">QR을 촬영하면 박태완 카마스터 전자명함으로 바로 연결됩니다.<br>차량 견적·구매혜택·시승·신차 상담을 한 곳에서 확인하세요.</div><div class="buttons"><a class="primary" href="./">🚘 전자명함 열기</a><a class="secondary" href="tel:01035656778">☎ 박태완에게 전화</a><button class="secondary" onclick="share()">↗ 전자명함 보내기</button></div><div class="foot">현대자동차 공식 차량정보 확인 후 박태완 카마스터에게 편하게 상담하세요.</div></section></main><script>async function share(){const d={title:'박태완 | 현대자동차 통영지점',text:'박태완 카마스터 전자명함 · 현대자동차 신차 견적 및 구매상담',url:new URL('./',location.href).href};if(navigator.share){try{await navigator.share(d)}catch(e){}}else{try{await navigator.clipboard.writeText(d.url);alert('전자명함 주소를 복사했습니다.')}catch(e){}}}</script></body></html>
