<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#002c5f"><title>박태완 카마스터 맞춤 차량상담</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;color:#142b45}.wrap{max-width:680px;margin:auto;padding:18px 13px 60px}.hero{background:linear-gradient(135deg,#002c5f,#006b9c);color:white;padding:28px 22px;border-radius:26px}.hero small{font-weight:800;color:#cce6f2}.hero h1{font-size:30px;margin:9px 0}.hero p{line-height:1.7;font-size:13px;color:#d8e8f1}.box{background:#fff;margin-top:12px;padding:20px;border-radius:21px;border:1px solid #dce5ed}.box h2{font-size:16px;margin:0 0 14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid #d7e1ea;background:#f8fafc;border-radius:13px;padding:13px 8px;font-weight:800;color:#23425e;cursor:pointer}.choice.active{background:#002c5f;color:#fff;border-color:#002c5f}label{display:block;font-size:12px;font-weight:800;color:#667d90;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #d6e1e9;border-radius:12px;padding:13px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}.send{width:100%;border:0;border-radius:15px;background:#00aad2;color:#fff;font-weight:950;font-size:16px;padding:17px;margin-top:14px;cursor:pointer}.call{display:block;text-align:center;text-decoration:none;color:#002c5f;font-weight:900;margin-top:13px}.note{font-size:11px;color:#7b8d9c;line-height:1.65;margin-top:12px}</style></head><body><main class="wrap"><section class="hero"><small>HYUNDAI MOTOR · TONGYEONG</small><h1>박태완 카마스터<br>맞춤 차량상담</h1><p>차종을 정확히 정하지 않으셔도 됩니다. 사용 목적과 예산을 알려주시면 상담에 필요한 내용을 문자로 간편하게 보내실 수 있습니다.</p></section><form class="box" onsubmit="send(event)"><h2>1. 관심 차량 유형</h2><div class="choices" id="types"><button type="button" class="choice" data-v="SUV">SUV</button><button type="button" class="choice" data-v="승용">승용</button><button type="button" class="choice" data-v="하이브리드">하이브리드</button><button type="button" class="choice" data-v="전기차">전기차</button><button type="button" class="choice" data-v="포터·소형트럭">포터·소형트럭</button><button type="button" class="choice" data-v="아직 미정">아직 미정</button></div><input type="hidden" id="type" value="아직 미정"><label>관심 차종 (알고 계시면)</label><input id="model" placeholder="예: 싼타페, 팰리세이드, 아이오닉 5"><label>예산</label><select id="budget"><option>아직 미정</option><option>3천만원 이하</option><option>3천~4천만원</option><option>4천~5천만원</option><option>5천~7천만원</option><option>7천만원 이상</option></select><label>구매 방식</label><select id="pay"><option>상담 후 결정</option><option>현금</option><option>할부</option><option>개인사업자·법인</option></select><label>구매 예정시기</label><select id="when"><option>상담 후 결정</option><option>1개월 이내</option><option>3개월 이내</option><option>6개월 이내</option><option>올해 안</option><option>정보 수집 중</option></select><label>주 사용 목적</label><input id="use" placeholder="예: 가족용, 출퇴근, 업무용"><label>궁금한 점</label><textarea id="memo" placeholder="차량, 옵션, 출고, 구매혜택 등 궁금한 내용을 적어주세요."></textarea><button class="send">박태완 카마스터에게 문자 상담하기</button><a class="call" href="tel:01035656778">☎ 바로 전화하기 010-3565-6778</a><p class="note">입력한 내용은 서버에 저장하지 않고 휴대폰 문자 작성 화면에만 전달됩니다. 차량 가격·혜택·재고·출고조건은 계약 시점의 현대자동차 공식 안내를 확인해 주세요.</p></form></main><script>document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('type').value=b.dataset.v});function send(e){e.preventDefault();const g=id=>document.getElementById(id).value;const body=`안녕하세요. 박태완 카마스터님, 전자명함을 보고 차량 상담드립니다.\n\n관심유형: ${g('type')}\n관심차종: ${g('model')||'미정'}\n예산: ${g('budget')}\n구매방식: ${g('pay')}\n구매예정: ${g('when')}\n사용목적: ${g('use')||'미정'}\n궁금한점: ${g('memo')||'없음'}`;location.href='sms:01035656778?body='+encodeURIComponent(body)}</script><script src="/card-analytics.js" data-card-id="hyundai_park_taewan"></script></body></html>
